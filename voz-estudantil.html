<main><section class="card"><h2>Consulta sobre o preço do lanche</h2><p>Este projeto busca conhecer a opinião dos estudantes sobre a proposta de redução do preço do lanche escolar.</p><h3>Você é a favor ou contra a redução?</h3><button id="f" onclick="votar('f')">A favor da redução</button><button class="alt" id="c" onclick="votar('c')">Contra a redução</button><p id="msg" role="status"></p></section>

<script>

function atualizar(){let t=v.f+v.c;document.getElementById('total').textContent='Total de votos: '+t;for(let k of ['f','c']){let p=t?v[k]/t*100:0;document.getElementById('r'+k).textContent=(k==='f'?'A favor':'Contra')+': '+v[k]+' ('+p.toFixed(1)+'%)';document.getElementById('p'+k).value=p}if(localStorage.getItem('vozVotou')){document.getElementById('f').disabled=true;document.getElementById('c').disabled=true;document.getElementById('msg').textContent='Voto registrado neste navegador.'}}
